name: Build Cydia Package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix path and build with Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 make git clang software-properties-common
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get install -y ldid || {
            sudo wget -O /usr/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
            sudo chmod +x /usr/bin/ldid
          }

          git clone --recursive https://github.com/theos/theos.git ~/theos
          export THEOS=~/theos

          # Move project to a path without spaces to satisfy Theos
          mkdir -p ~/safe_workspace
          cp -r "My First App" ~/safe_workspace/MyFirstApp
          cd ~/safe_workspace/MyFirstApp

          make package
          cp packages/*.deb ~/work/Lucky-s-cydia-repo/Lucky-s-cydia-repo/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cydia-package
          path: '*.deb'
