name: Build Cydia Package

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dpkg-dev and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev build-essential

      - name: Build package
        run: |
          mkdir -p debs
          dpkg-deb --build "My First App" debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cydia-package
          path: debs/*.deb
