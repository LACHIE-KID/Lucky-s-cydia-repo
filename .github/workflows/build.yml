name: Build Cydia Package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: litten/theos:latest
    steps:
      - name: Checkout Code
        uses: actions/upload-artifact@v4

      - name: Build Package
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: myapp-deb
          path: packages/*.deb

